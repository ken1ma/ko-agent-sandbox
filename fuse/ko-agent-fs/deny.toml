# The license gate, run in the build container before the binary is produced (`Containerfile`), so a
# dependency arriving under an unexpected licence fails the build rather than shipping unnoticed.
#
# Only permissive licences, and only the ones the tree actually carries — cargo-deny warns on an
# allowance nothing uses, so a speculative entry is noise on every build; extend the list when a
# dependency actually arrives under a new (still permissive) licence. Copyleft is deliberately
# absent, including weak copyleft such as MPL-2.0: this binary ships inside a user's environment,
# and `SECURITY.md` ("The workspace filter") names this gate as permissive-only.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# A duplicate major version of a dependency is noise, not an error, in a tree this small.
multiple-versions = "allow"
# Nothing here should need a C toolchain beyond the linker. Neither crate is in Cargo.lock today:
# a tripwire for the day a dependency brings one in, not a fact about the current tree.
deny = ["cc", "bindgen"]

[advisories]
# The image build runs `check licenses bans sources` and not `advisories`, deliberately: those three
# are decided by Cargo.lock, so they answer the same today and next year, while the advisory database
# is a moving external input. Gating on it would make a build that passed yesterday fail today with
# no source change — and this build is how a user installs the filter, so it would also block the
# `--build` needed to ship the fix. Advisories belong to a scheduled run instead, which is the CI row
# in the repository's `doc/TODO.md`; nothing runs them today.
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
