// The run-on-host checks' Gradle fixture has one module and one test class. Keep it limited to what the checks
// exercise.
// - The build uses the Gradle distribution that its wrapper downloaded (RunOnHostPrereqs.gradleDistributionDir).
// - The property `checkToolchain` asks for a toolchain that the launch does not grant; the toolchain row sends
//   this request.
// - `run` prints the temporary directory that the forked JVM sees. With the argument `sleep`, `run` stays up for
//   the cancel and teardown rows.
plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    if (project.hasProperty('checkToolchain')) {
        toolchain.languageVersion = JavaLanguageVersion.of(project.property('checkToolchain') as int)
    }
}

application {
    mainClass = 'fixture.Main'
}

tasks.named('test') {
    useJUnitPlatform()
}
