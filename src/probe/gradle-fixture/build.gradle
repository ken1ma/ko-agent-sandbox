// The security acceptance test's Gradle fixture has one module and one test class. Keep it limited to what
// the acceptance test exercises. The build uses the Gradle distribution its wrapper downloaded
// (RunOnHostPrereqs.gradleDistributionDir). `acceptanceToolchain` asks for a toolchain the launch does
// not grant, the toolchain row's request; `run` prints the temporary directory the forked JVM
// sees and, with `sleep`, stays up for the cancel and teardown rows.
plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    if (project.hasProperty('acceptanceToolchain')) {
        toolchain.languageVersion = JavaLanguageVersion.of(project.property('acceptanceToolchain') as int)
    }
}

application {
    mainClass = 'fixture.Main'
}

tasks.named('test') {
    useJUnitPlatform()
}
